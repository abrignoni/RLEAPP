name: Test builds

# Builds RLEAPP with packaging/build.py on every platform and architecture it ships for,
# runs what came out, builds what each platform ships (an installer on macOS and Linux,
# the single-file executable on Windows), and uploads the lot. Nothing here
# is a release; release.yml runs the same steps when a version tag is pushed. It exists so
# every platform's build is produced and actually executed, without anyone owning the
# hardware.
#
# The smoke test is the point, not decoration. iLEAPP's frozen builds shipped a startup
# crash for a long time (missing hidden imports) precisely because nothing ever ran a
# built binary. `build.py smoke` runs the executable the ways a user does: --version, a
# run over an empty extraction, a run over the NTFS raw fixture, and the window's
# --selfcheck, which counts the artifacts the build loaded against the source.
#
# Advisory rather than required, so a paths filter is fine here. A logic change inside an
# existing module almost never breaks a build; packaging and dependency changes are where
# the breaks come from, and the weekly build of main covers the rest.

on:
  workflow_dispatch:
  # Monday 06:00 UTC.
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
    paths:
      - 'packaging/**'
      - 'requirements.txt'
      - '.github/workflows/test_builds.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # `os` is the runner; `name` is what the job and its artifact are called, since
        # a runner label such as macos-latest does not say which machine it is.
        include:
          - os: windows-latest
            name: windows-x64
          - os: windows-11-arm
            name: windows-11-arm
          - os: macos-latest
            name: macos-apple_silicon
          # Intel Macs. GitHub drops x86_64 macOS when macos-15-intel retires in 2027.
          - os: macos-15-intel
            name: macos-15-intel
          # 22.04 rather than 24.04: a build runs only on the glibc it was made against or
          # a newer one, and 22.04's 2.35 still covers the SIFT workstation and the LTS
          # releases examiners keep.
          - os: ubuntu-22.04
            name: ubuntu-22.04-x64
          - os: ubuntu-22.04-arm
            name: ubuntu-22.04-arm
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The latest supported Python, and the first with compression.zstd, which a
          # zstd-compressed tar, SquashFS or UBIFS needs.
          python-version: '3.14'

      - name: Provide OpenSSL for the cryptography source build (Windows arm64 only)
        # pdfminer.six depends on cryptography, which publishes no win_arm64 wheels, so
        # on Windows-on-ARM pip builds it from source: Rust is on the runner already,
        # OpenSSL is not. Step taken verbatim from iLEAPP's test_builds.yml, which hit
        # the same wall.
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $vcpkg = 'vcpkg'
          if (-not (Get-Command vcpkg -ErrorAction SilentlyContinue)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg C:\vcpkg-local
            & C:\vcpkg-local\bootstrap-vcpkg.bat
            $vcpkg = 'C:\vcpkg-local\vcpkg.exe'
          }
          & $vcpkg install openssl:arm64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $roots = @('C:\vcpkg-local', $env:VCPKG_INSTALLATION_ROOT) | Where-Object { $_ }
          $installed = $roots | ForEach-Object { Join-Path $_ 'installed\arm64-windows-static-md' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $installed) { Write-Error 'vcpkg OpenSSL install dir not found'; exit 1 }
          "OPENSSL_DIR=$installed" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Linux, the window's toolkit and a display for its self-check
        # The window imports tkinter, and PyInstaller needs that import to succeed at
        # analysis time; the hard check turns a missing toolkit into a readable failure.
        # xvfb gives the --selfcheck a display.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libtcl8.6 libtk8.6 xvfb
          python -c "import tkinter" || { echo "tkinter unavailable in this Python"; exit 1; }

      - name: Phase 1, the rleapp executable
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python packaging/build.py exe

      - name: Smoke test the build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python packaging/build.py smoke
          else
            python packaging/build.py smoke
          fi

      # Windows ships only the single-file executable, in its portable zip; see release.yml.
      # The folder build above is still made and smoke-tested here, and costs no signing.
      # Nothing here is signed: signing is release.yml's, with SignPath.
      - name: Phase 1, the single-file executable (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: python packaging/build.py exe --onefile

      - name: Smoke test the single-file executable (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: python packaging/build.py smoke --onefile

      - name: Phase 2, the disk image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python packaging/build.py installer
          ls -l dist/RLEAPP-*.dmg

      # build.py runs the finished AppImage once and requires it to report the version.
      - name: Phase 2, the AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python packaging/build.py installer
          ls -l dist/RLEAPP-*.AppImage

      # The one-folder build, with Windows' single-file executable and Linux's AppImage.
      - name: Upload the build (Windows, Linux)
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: rleapp-${{ matrix.name }}-test
          path: |
            dist/RLEAPP/
            dist/rleapp.exe
            dist/RLEAPP-*.AppImage
          retention-days: 14
          if-no-files-found: error

      # macOS ships only the disk image. dist/RLEAPP/ is there too, the one-folder build
      # PyInstaller copies into the .app, but nothing ships or tests it. The .app goes up
      # inside its .dmg: an artifact zip keeps neither the bundle's symlinks nor its
      # signature.
      - name: Upload the build (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: rleapp-${{ matrix.name }}-test
          path: dist/RLEAPP-*.dmg
          retention-days: 14
          if-no-files-found: error
